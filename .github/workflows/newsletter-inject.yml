name: Newsletter form on pages

# Τρέχει μόνο στα branches newsletter-form / newsletter-en. Τίποτα δεν πάει στο main
# χωρίς έγκριση του Pull Request.
on:
  push:
    branches: [newsletter-form, newsletter-en]
    paths: [".github/newsletter_setup.py", ".github/newsletter_en.py", ".github/workflows/newsletter-inject.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/newsletter_setup.py && python3 .github/newsletter_en.py
      - name: Commit
        run: |
          git config user.name "SphragisAI"
          git config user.email "info@sphragisai.com"
          git rm -q --ignore-unmatch .github/nl_inject.py
          git add -A '*.html'
          git diff --cached --quiet || git commit -m "Newsletter: nl.js στις σελίδες και πολιτική απορρήτου"
          git push
