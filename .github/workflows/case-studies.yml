name: Case studies build

# Χτίζει την ενότητα Case studies: link στο μενού και στο footer κάθε σελίδας,
# σελίδες λίστας /case-studies/ (EL/EN), header/footer/analytics του site στις
# σελίδες των case studies, κάρτα στο blog και εγγραφές στο sitemap.
# Τρέχει όταν αλλάζει το script ή χειροκίνητα. Το script είναι idempotent.

on:
  push:
    branches: [main]
    paths: ['.github/case_studies_build.py']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build case studies section
        run: python3 .github/case_studies_build.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Case studies section: menu link, listing pages, site shell, blog card, sitemap"
          git pull --rebase origin main
          git push origin HEAD:main
