name: Bot knowledge sync

# Στέλνει τις σελίδες του site (Blog, Radar, υπηρεσίες, case studies, εργαλεία, οδηγοί)
# στη γνώση του βοηθού AI. Μόνο οι σελίδες που άλλαξαν. Ταυτοποίηση με GitHub OIDC.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '.github/bot_knowledge_sync.py'
      - '.github/workflows/bot-knowledge-sync.yml'
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: bot-knowledge-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync pages to the AI assistant
        run: python3 .github/bot_knowledge_sync.py
